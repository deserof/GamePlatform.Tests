name: api-tests

on:
  workflow_dispatch:
    inputs:
      environment:
        description: TEST_ENVIRONMENT (appsettings.{env}.json)
        required: true
        default: dev
        type: choice
        options:
          - dev
          - int
          - stage

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore GamePlatform.Tests.sln

      - name: Build
        run: dotnet build GamePlatform.Tests.sln --configuration Release --no-restore

      - name: Test
        env:
          TEST_ENVIRONMENT: ${{ inputs.environment }}
          TestSettings__Tester__Email: ${{ secrets.TESTSETTINGS__TESTER__EMAIL }}
          TestSettings__Tester__Password: ${{ secrets.TESTSETTINGS__TESTER__PASSWORD }}
        run: >
          dotnet test Player.Api.Tests/Player.Api.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
          if-no-files-found: warn
      
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: error
            